<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Gamer Shop</title>
    
    <link rel="stylesheet" href="../css/stylos.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body class="contacto">

    <div class="carrito-contacto">
      <i class="fa-solid fa-cart-shopping"></i>
    </div>

    <header class="barra-contacto">
        <h2 class="nombre-tienda">Tienda Gamer</h2>

        <nav class="nav-contacto">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header> 

    <h1 class="titulo-contacto">Contacto</h1>

    <form action="https://formspree.io/f/mkjgrdwv" method="POST">

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="correo">Correo:</label>
        <input type="email" id="correo" name="correo" required>

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" required></textarea>

        <button class="boton-enviar" type="submit">Enviar</button>

    </form>

    <footer class="footer-contacto">
        <p>2026 GamerShop - Todos los derechos reservados</p>

        <div class="redes-contacto">
            <a href="#">Instagram</a>
            <a href="#">Tik Tok</a>
            <a href="#">X</a>
        </div>
    </footer>

</body>

</html>
